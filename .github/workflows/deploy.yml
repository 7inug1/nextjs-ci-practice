# ── 1. 머리말: 언제 실행할지, 무엇을 허락할지, 겹치면 어떻게 할지 ──
name: Deploy                      # Actions 탭 목록에 보이는 이름

on:                               # 이 파일이 언제 실행될지 (버튼의 addEventListener처럼)
  push:
    branches: [main]              # main에 머지될 때 실행. PR 단계에서는 실행 안 됨 (검사 중인 코드가 사이트에 올라가면 안 되니까)
  workflow_dispatch:              # Actions 탭에 "Run workflow" 버튼이 생김. 코드 변경 없이 다시 배포하고 싶을 때 누름

# 이 파일이 GitHub에서 할 수 있는 일을 정함 (출입증 같은 것)
# 적은 것만 허락되고 나머지는 전부 금지. 실수나 악성 코드가 있어도 피해가 작아짐
permissions:
  contents: read                  # 저장소 코드를 읽을 수 있음 (고치지는 못함)
  pages: write                    # GitHub Pages 사이트를 올릴 수 있음
  id-token: write                 # "나는 이 저장소에서 온 배포다"라고 증명하는 일회용 신분증을 받을 수 있음. 맨 아래 deploy-pages가 이걸 씀

# 배포를 한 번에 하나씩만 하게 하는 줄 서기 규칙
# 예: 머지를 연달아 두 번 하면 두 번째 배포는 첫 번째가 끝날 때까지 기다림
concurrency:
  group: pages                    # 줄 이름. 같은 줄 이름끼리 순서를 지킴
  cancel-in-progress: false       # 앞사람(진행 중인 배포)을 중간에 끊지 않음. 끊으면 사이트가 반만 올라갈 수 있음

jobs:                             # 실제로 할 일 목록. job마다 GitHub이 새 컴퓨터를 한 대씩 빌려줌

  # ── 2. build: 사이트 파일을 만들어서 보관함에 넣기 ──
  # 앞부분은 ci.yml과 같음. lint, test 같은 검사는 PR 단계에서 ci.yml이 이미 했으므로 여기선 뺌
  build:
    runs-on: ubuntu-latest        # 빌려 쓸 컴퓨터 종류 (리눅스)
    steps:                        # 위에서부터 하나씩 실행. 하나라도 실패하면 거기서 멈춤
      - uses: actions/checkout@v7         # 빈 컴퓨터에 저장소 코드를 내려받음
      - uses: actions/setup-node@v7       # Node.js 설치
        with:
          node-version-file: .nvmrc       # 내 컴퓨터와 같은 Node 버전을 쓰도록 .nvmrc 파일에서 버전을 읽음
          cache: npm                      # 내려받은 패키지를 저장해 두고 다음 실행 때 재사용 (빨라짐)
      - id: pages                         # 이 단계에 붙인 변수 이름. 아래에서 steps.pages로 이 단계의 결과를 꺼냄
        uses: actions/configure-pages@v6  # GitHub Pages 설정을 읽어서 사이트 주소 정보를 알려 줌
      - run: npm ci                       # package-lock.json에 적힌 버전 그대로 패키지 설치
      - run: npm run build                # 사이트를 빌드. 결과 파일(HTML, CSS, JS)이 out/ 폴더에 생김
        env:                              # 빌드할 때 넘길 환경 변수
          # 사이트 주소가 7inug1.github.io/nextjs-ci-practice/ 라서 파일 경로 앞에 /nextjs-ci-practice 를 붙여야 함
          # ${{ }} 는 JS 템플릿 문자열의 ${} 처럼 실행 중에 실제 값으로 바뀜. 위 configure-pages가 알려 준 값을 넣음
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5   # out/ 폴더를 GitHub 보관함에 넣음. 다음 job은 다른 컴퓨터라서 이렇게 넘겨줘야 함
        with:
          path: ./out                            # 보관함에 넣을 폴더

  # ── 3. deploy: 보관함에서 꺼내 실제 사이트로 공개하기 ──
  # 빌드는 이미 끝났으므로 코드 내려받기나 Node 설치가 필요 없음
  deploy:
    needs: build                          # build가 성공해야 시작 (await 같은 것). 없으면 두 job이 동시에 시작해서 올릴 파일이 없음
    runs-on: ubuntu-latest                # 새로 빌려 쓰는 컴퓨터 (build 컴퓨터와 다른 컴퓨터)
    environment:                          # 배포 기록장. 저장소 화면의 Deployments에 언제 어떤 커밋이 배포됐는지 남음
      name: github-pages                  # 기록장 이름. Pages 배포는 이 이름을 씀
      url: ${{ steps.deployment.outputs.page_url }}   # 배포된 사이트 주소. Actions 실행 화면에 링크로 뜸
    steps:
      - id: deployment                    # 이 단계의 변수 이름. 바로 위 url 줄에서 steps.deployment로 결과를 꺼냄
        uses: actions/deploy-pages@v5     # 보관함의 파일을 꺼내 GitHub Pages에 공개. 이 순간 실제 사이트가 바뀜
